[package]
name = "cadris"
version = "0.3.1"
description = "Fast cross-platform photo culling"
authors = ["Cadris"]
edition = "2021"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
# The `_lib` suffix may seem redundant but it is necessary
# to make the lib name unique and wouldn't conflict with the bin name.
# This seems to be only an issue on Windows, see https://github.com/rust-lang/cargo/issues/8519
name = "cadris_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rusqlite = { version = "0.38", features = ["bundled"] }
kamadak-exif = "0.6.1"
plist = "1.10.1"
image = { version = "0.25", default-features = false, features = ["jpeg", "png", "tiff", "webp"] }
fast_image_resize = { version = "6.1", features = ["image"] }
notify = "8.2"
rayon = "1.11"
walkdir = "2.5"
blake3 = "1.8"


# Read the optimization guideline for more details: https://tauri.app/concept/size/#cargo-configuration
[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
xattr = "1.6.1"
